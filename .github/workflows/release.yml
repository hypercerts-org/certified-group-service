name: Release

on:
  workflow_dispatch:
  # Auto-cut the tag + GitHub Release as soon as the "Version Packages"
  # PR is merged. Phase 1 (opening/updating that PR after a changeset
  # lands on main) is still triggered manually via workflow_dispatch.
  #
  # This listens on push to main rather than `pull_request: closed`: the
  # release job uses the `release` environment, whose deployment branch
  # policy only admits `main`, and GitHub evaluates that policy against
  # `refs/pull/<n>/merge` for pull_request events.
  push:
    branches: [main]

jobs:
  # Decide whether a push to main is the merge of the release PR (head
  # branch `changeset-release/main`, the branch changesets/action pushes
  # to). Runs without the `release` environment, so it has no access to
  # the release bot credentials.
  detect:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          heads=$(gh api "repos/${{ github.repository }}/commits/$SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main") | .head.ref] | join(" ")')
          echo "Merged PR head refs for $SHA: ${heads:-<none>}"
          if [[ " $heads " == *" changeset-release/main "* ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: detect
    # `always()` lets workflow_dispatch run even though `detect` is skipped
    # for it; a push only proceeds when `detect` saw the release PR merge.
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.detect.result == 'success' && needs.detect.outputs.is_release == 'true'))
    runs-on: ubuntu-latest
    # Serialize release operations without holding the group during `detect`:
    # a queued release run is replaced by any newer pending run in the same
    # group, so unrelated pushes must not be able to enter it.
    concurrency: ${{ github.workflow }}-main
    # Release bot credentials live in this environment, restricted to main.
    environment: release
    permissions:
      contents: write
      pull-requests: write
      # npm Trusted Publishing: npm exchanges the workflow's OIDC token for a
      # short-lived publish token, so the repository holds no npm token.
      id-token: write

    steps:
      - name: Generate Release Bot App Token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Check out main explicitly so changesets/action tags and
          # pushes from the merged tip.
          ref: main
          # Persist releasebot app credentials so the changesets/action push
          # can bypass branch protection rules on main.
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0

      # workflow_dispatch is constrained to main here as a defence in
      # depth — the push trigger is already filtered to main, and the
      # `release` environment only admits main.
      - name: Validate branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Release workflow can only be dispatched from the 'main' branch."
            exit 1
          fi

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          # Pinned to 22.22.3: Node 22.23.0 (and 24.17.0) regressed http.Agent
          # keep-alive socket reuse (nodejs/node#63989), which makes node-fetch@2
          # — used by @changesets/get-github-info for the GitHub GraphQL call in
          # the release step below — throw ERR_STREAM_PREMATURE_CLOSE. The
          # ubuntu-latest image 20260622 bumped cached Node 22.22.3 -> 22.23.0,
          # which is exactly when releases started failing. Unpin once a fixed
          # 22.23.x ships.
          node-version: 22.22.3
          cache: 'pnpm'
          registry-url: https://registry.npmjs.org

      # Node 22.22.3 bundles npm 10, which predates npm Trusted Publishing (OIDC
      # provenance requires npm >= 11.5.1).
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      # Fail fast before any versioning/git operations.
      - run: pnpm build
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm client:check
      - run: pnpm client:build

      # Guard: no prerelease mode should be active on main.
      - name: Verify no active prerelease mode
        run: |
          if [ -f .changeset/pre.json ]; then
            mode=$(jq -r '.mode' .changeset/pre.json)
            if [ "$mode" = "pre" ]; then
              echo "::error::Active prerelease mode detected on main."
              echo "Prerelease mode must be exited before running a stable release."
              exit 1
            fi
            echo "Prerelease mode is not active (mode=$mode)"
          else
            echo "No prerelease mode detected"
          fi

      # Changesets tracks both the private root `group-service` package and
      # public workspace packages under `packages/` (such as `@hypercerts-org/certified-group-service`).
      #
      # On each run:
      #   1. If pending changesets exist, opens/updates a Release PR that bumps
      #      the affected package versions and updates their CHANGELOG.md files.
      #   2. If the Release PR has been merged, runs `pnpm release`
      #      (`changeset publish`), which publishes public packages to npm with
      #      Trusted Publishing + provenance and creates per-package git tags
      #      and GitHub Releases (`group-service@X.Y.Z`, `@hypercerts-org/certified-group-service@X.Y.Z`).
      - name: Create Release Pull Request or Publish Releases
        id: changesets
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0
        with:
          publish: pnpm release
          version: pnpm version-packages
          title: 'chore: release'
          commit: 'chore: release'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: true

      # changesets/action does not support templating versions into the PR
      # title (see changesets/action#388). Rename the Release PR to name every
      # package bumped on `changeset-release/main` compared to `main`.
      - name: Rename Release PR with version
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          set -o pipefail
          BUMPED=()
          for manifest in package.json packages/certified-group-service/package.json; do
            BASE_VER=$(node -p "JSON.parse(require('node:fs').readFileSync('$manifest', 'utf8')).version")
            HEAD_JSON=$(gh api \
              "repos/${{ github.repository }}/contents/${manifest}?ref=changeset-release/main" \
              -H "Accept: application/vnd.github.raw" 2>/dev/null || true)
            if [ -z "$HEAD_JSON" ]; then continue; fi
            HEAD_NAME=$(node -e "process.stdout.write(JSON.parse(process.argv[1]).name || '')" "$HEAD_JSON" || true)
            HEAD_VER=$(node -e "process.stdout.write(JSON.parse(process.argv[1]).version || '')" "$HEAD_JSON" || true)
            if [ -n "$HEAD_VER" ] && [ "$HEAD_VER" != "$BASE_VER" ]; then
              BUMPED+=("${HEAD_NAME}@${HEAD_VER}")
            fi
          done
          if [ "${#BUMPED[@]}" -eq 0 ]; then
            echo "::warning::Could not determine bumped package versions; leaving PR title unchanged."
            exit 0
          fi
          NEW_TITLE="prepare for release $(IFS=', '; echo "${BUMPED[*]}")"
          echo "Renaming PR #$PR_NUMBER to: $NEW_TITLE"
          if ! gh pr edit "$PR_NUMBER" --title "$NEW_TITLE"; then
            echo "::warning::Failed to rename PR #$PR_NUMBER; leaving title unchanged."
            exit 0
          fi

      - name: Log release
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          echo "Released packages: ${PUBLISHED_PACKAGES}"
